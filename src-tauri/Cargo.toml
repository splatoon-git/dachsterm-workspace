[package]
name = "dachsterm"
version = "0.5.1"
edition = "2024"
default-run = "dachsterm"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
portable-pty = "=0.9.0"
tauri = { version = "=2.12.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
russh = { version = "=0.65.1", default-features = false, features = ["ring"] }
ring = "=0.17.14"
crypto-bigint = { version = "=0.7.10", features = ["zeroize"] }
pkcs1 = { version = "=0.8.0-rc.4", features = ["pem"] }
pkcs8 = { version = "=0.11.0", features = ["encryption", "pem"] }
tokio = { version = "1", features = ["full"] }
russh-sftp = "=3.0.1"
suppaftp = { version = "=12.2.1", features = ["tokio-rustls-ring", "no-log"] }
rustls-native-certs = "=0.8.5"
# The service check reads the certificate a server presents (TL.8).
x509-cert = "=0.3.0"
encoding_rs = "=0.8.35"
# NFC upload names. Already in the graph through url; pinned to the locked version.
icu_normalizer = { version = "=2.4.0", default-features = false, features = ["compiled_data"] }
sha2 = "0.10"
argon2 = { version = "=0.5.3", features = ["zeroize"] }
aes-gcm = { version = "=0.10.3", features = ["zeroize"] }
rfd = "0.15"
rusqlite = { version = "0.41", features = ["bundled"] }
keyring = { version = "3.6", features = ["windows-native", "apple-native"] }
uuid = { version = "1", features = ["v4"] }
zeroize = "1"
dirs = "6"
base64 = "0.22"
hmac = "0.12"
sha1 = "0.10"
tempfile = "3"
arboard = { version = "=3.6.1", default-features = false, features = ["image-data"] }
png = "0.18"
open = "=5.3.3"
tauri-plugin-notification = "=2.8.0"

# The local tabs' agent pipe (DX.13) needs a DACL for the current user, and the port list (TL.7)
# reads the socket tables and process names, and the route trace sends ICMP echoes. Already in the graph.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading"] }

# Starting a file drag out to the desktop (GE.3). Windows and macOS are the shipped targets.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
drag = "=2.1.1"

[dev-dependencies]

