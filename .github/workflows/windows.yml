name: Windows verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Locked dependencies
        run: npm ci
      - name: Browser runtime
        run: npx playwright install chromium
      - name: Rust toolchain
        run: rustup show
      # Every branch restores this, and only main writes it, because push runs on every branch
      # and branch caches would use up the repository's cache limit.
      - name: Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The project's released binary. Building it from source took about six minutes.
      - name: Audit tool
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit@0.22.2
      - name: Automated Windows gates
        shell: pwsh
        run: ./scripts/verify-windows.ps1
      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-ui-results
          path: |
            test-results
            target/verification
          retention-days: 7
