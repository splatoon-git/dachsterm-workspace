name: Windows verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Locked dependencies
        run: npm ci
      - name: Browser runtime
        run: npx playwright install chromium
      - name: Rust toolchain
        run: rustup show
      - name: Audit tool
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Automated Windows gates
        shell: pwsh
        run: ./scripts/verify-windows.ps1
      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-ui-results
          path: |
            test-results
            target/verification
          retention-days: 7
