name: macOS verification
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Locked dependencies
        run: npm ci
      - name: Browser runtime
        run: npx playwright install chromium
      - name: Rust toolchain
        run: rustup show
      # Every branch restores this, and only main writes it, because push runs on every branch
      # and branch caches would use up the repository's cache limit.
      - name: Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Automated macOS gates and app bundle
        run: bash scripts/verify-macos.sh --package
      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-ui-results
          path: test-results
          retention-days: 7
